name: Deploy SIEVOX

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sievox-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Test and build
        run: |
          npm ci --prefix backend
          npm test --prefix backend
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          tar --exclude=backend/node_modules --exclude='backend/.env*' --exclude='*uploads*' --exclude=backend/ssl -czf sievox-release.tar.gz backend frontend/dist frontend/src frontend/public frontend/package.json frontend/package-lock.json frontend/index.html frontend/vite.config.js frontend/tailwind.config.js frontend/postcss.config.js scripts/deploy-sievox.sh
      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: sievox-release.tar.gz
          target: /var/tmp/sievox-deploy-${{ github.run_id }}
      - name: Deploy current site
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            release=/var/tmp/sievox-deploy-${{ github.run_id }}
            tar -xzf "$release/sievox-release.tar.gz" -C "$release"
            bash "$release/scripts/deploy-sievox.sh" "$release"
      
      - name: ✅ 部署成功通知
        if: success()
        run: echo "🎉 部署成功完成！"
      
      - name: ❌ 部署失败通知
        if: failure()
        run: echo "💥 部署失败，请检查日志！"
